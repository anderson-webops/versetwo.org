name: Validate and package static site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Regenerate and check the tracked website
        run: |
          python3 scripts/build_prototype.py
          git diff --exit-code -- prototype
          python3 scripts/check_static.py
      - name: Test deployment boundaries and archive integrity
        run: python3 -m unittest discover -s tests -v
      - name: Build and independently accept the deployment artifact
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          python3 scripts/build_site.py --commit "$SOURCE_COMMIT" --ref "$SOURCE_REF"
          python3 scripts/verify_site.py build/versetwo.org-static.tar.gz --commit "$SOURCE_COMMIT"
      - name: Upload the static deployment package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: versetwo-static-site-${{ github.sha }}
          path: build/
          if-no-files-found: error
          retention-days: 30
